name: CI Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  precheck:
    name: Pre-check
    uses: t-head/.github/.github/workflows/user-precheck.yml@main

  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: precheck
    uses: t-head/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  human-review:
    name: Human Review Gate
    needs: ai-code-review
    uses: t-head/.github/.github/workflows/human-review.yml@main
    secrets: inherit

  ci:
    name: Full CI (PPU)
    needs: human-review
    uses: ./.github/workflows/pla-basic-test-ppu.yml
    secrets: inherit
