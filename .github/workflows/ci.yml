name: CI Pipeline

on:
  workflow_dispatch:
    inputs:
      scan-base:
        description: Explicit base ref or SHA for the static compliance scan
        required: true
        type: string
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  precheck:
    name: Pre-check
    uses: t-head/.github/.github/workflows/user-precheck.yml@main

  static-compliance:
    name: Static Compliance
    needs: precheck
    uses: ./.github/workflows/static-compliance-scan.yml
    with:
      base: ${{ github.event.pull_request.base.sha || inputs.scan-base }}
      head: ${{ github.event.pull_request.head.sha || github.sha }}

  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: precheck
    uses: t-head/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  human-review:
    name: Human Review Gate
    needs: ai-code-review
    uses: t-head/.github/.github/workflows/human-review.yml@main
    secrets: inherit

  ci:
    name: Full CI (PPU)
    needs: [human-review, static-compliance]
    uses: ./.github/workflows/pla-basic-test-ppu.yml
    secrets: inherit
